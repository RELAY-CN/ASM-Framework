name: Gradle Build Test
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Permissions
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
